# GENERATED by scripts/ops/config-gen.ts. CLI is bundled with the action release.
name: Testsy
description: Run Testsy plain-English QA tests and wait for the evidence.
author: Testsy
branding:
  icon: check-circle
  color: blue
inputs:
  api-key:
    description: Testsy workspace API key. Store it in a repository secret.
    required: true
  project:
    description: Project id whose tests should run.
    required: false
  tests:
    description: Comma-separated saved test ids to run.
    required: false
  build:
    description: APK or zipped iOS Simulator app paths, https links to them (EAS, Bitrise, S3, GitHub artifacts), or build ids; one per line.
    required: false
  build-label:
    description: Label for uploaded builds (defaults to the commit).
    required: false
  fingerprint:
    description: Native fingerprint of the app (for example @expo/fingerprint). With build files it is stored with the upload; alone it only asks whether that native build is already there (outputs build-needed, build-id) and runs nothing.
    required: false
  target-url:
    description: Website tests start at this address instead of their saved one, for example the deployment's environment_url (a preview or staging deploy of the same site). App tests are unaffected.
    required: false
  device:
    description: App tests run on a phone or tablet this time (phone or tablet); the tests keep their own setting. Websites are unaffected.
    required: false
  os-version:
    description: App tests run on this OS version this time, for example latest, iOS 26 or Android 14 (list them with the CLI's devices command).
    required: false
  orientation:
    description: App tests start in this orientation this time, default (the device's own), portrait or landscape; the tests keep their own setting.
    required: false
  mode:
    description: auto, cold or warm.
    default: auto
  timeout:
    description: Time to wait for the suite, for example 45m.
    default: 45m
  fail-on:
    description: Comma-separated results that fail this step. Include blocked,inconclusive for a strict release gate.
    default: failed,error
  junit:
    description: Path for the JUnit report.
    default: testsy-junit.xml
  url:
    description: Testsy address (generated from shared/hosts.ts).
    default: https://app.testsy.dev
outputs:
  junit:
    description: Path of the JUnit report.
    value: ${{ inputs.junit }}
  build-needed:
    description: With fingerprint alone, "true" when no build with that fingerprint exists yet (build and upload it), "false" when one does.
    value: ${{ steps.testsy.outputs.build-needed }}
  build-id:
    description: With fingerprint alone, the existing build found by that fingerprint (empty when none).
    value: ${{ steps.testsy.outputs.build-id }}
  watch-urls:
    description: Space-separated no-login links to watch each started run live and read its result (for a PR comment or a chat message).
    value: ${{ steps.testsy.outputs.watch-urls }}
runs:
  using: composite
  steps:
    - name: Run saved tests
      id: testsy
      shell: bash
      env:
        TESTSY_AI_API_KEY: ${{ inputs.api-key }}
        TESTSY_AI_URL: ${{ inputs.url }}
        IN_PROJECT: ${{ inputs.project }}
        IN_TESTS: ${{ inputs.tests }}
        IN_MODE: ${{ inputs.mode }}
        IN_TIMEOUT: ${{ inputs.timeout }}
        IN_FAIL_ON: ${{ inputs.fail-on }}
        IN_JUNIT: ${{ inputs.junit }}
        IN_BUILD: ${{ inputs.build }}
        IN_BUILD_LABEL: ${{ inputs.build-label }}
        IN_FINGERPRINT: ${{ inputs.fingerprint }}
        IN_TARGET_URL: ${{ inputs.target-url }}
        IN_DEVICE: ${{ inputs.device }}
        IN_OS_VERSION: ${{ inputs.os-version }}
        IN_ORIENTATION: ${{ inputs.orientation }}
      run: |
        set -euo pipefail
        if [ -n "$IN_FINGERPRINT" ] && [ -z "$(printf '%s' "$IN_BUILD" | tr -d '[:space:]')" ]; then
          # Lookup only: is this native build already uploaded? Exit 1 means "no", which is an answer, not a failure.
          [ -n "$IN_PROJECT" ] || { echo "::error::project is required with fingerprint" >&2; exit 2; }
          node "$GITHUB_ACTION_PATH/bin/testsy.mjs" build find --project "$IN_PROJECT" --fingerprint "$IN_FINGERPRINT" || [ $? -eq 1 ]
          exit 0
        fi
        set -- run --mode "$IN_MODE" --timeout "$IN_TIMEOUT" --fail-on "$IN_FAIL_ON" --junit "$IN_JUNIT"
        [ -n "$IN_PROJECT" ] && set -- "$@" --project "$IN_PROJECT"
        [ -n "$IN_TESTS" ] && set -- "$@" --test "$IN_TESTS"
        while IFS= read -r build; do
          [ -z "$build" ] || set -- "$@" --build "$build"
        done <<< "$IN_BUILD"
        [ -n "$IN_BUILD_LABEL" ] && set -- "$@" --label "$IN_BUILD_LABEL"
        [ -n "$IN_FINGERPRINT" ] && set -- "$@" --fingerprint "$IN_FINGERPRINT"
        [ -n "$IN_TARGET_URL" ] && set -- "$@" --url "$IN_TARGET_URL"
        [ -n "${IN_DEVICE:-}" ] && set -- "$@" --device "$IN_DEVICE"
        [ -n "${IN_OS_VERSION:-}" ] && set -- "$@" --os-version "$IN_OS_VERSION"
        [ -n "${IN_ORIENTATION:-}" ] && set -- "$@" --orientation "$IN_ORIENTATION"
        node "$GITHUB_ACTION_PATH/bin/testsy.mjs" "$@"
